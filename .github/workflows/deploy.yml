name: Custom Deploy to GitHub Pages

on:
  # main 브랜치에 푸시될 때마다 실행
  push:
    branches: ["main"]
  # Actions 탭에서 수동으로 버튼을 눌러 실행할 수 있게 허용
  workflow_dispatch:

# GITHUB_TOKEN 의 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포가 있으면 취소하고 최신 커밋으로만 덮어쓴다.
# 연달아 푸시했을 때 배포가 줄줄이 대기하며 꼬이는 것을 막는다.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 버전을 고정한다. `latest` 로 받으면 어느 날 Hugo 가 올라가면서
      # 손댄 적 없는 사이트의 빌드가 깨진다. 실제로 0.146 에서 템플릿 구조가
      # 통째로 바뀐 전례가 있다. 올릴 때는 이 줄을 고쳐서 의도적으로 올린다.
      #
      # 표준 빌드다(extended 아님). 차이는 Sass/SCSS 컴파일뿐인데
      # 커스텀 프로퍼티를 쓴 순수 CSS 로 가므로 필요 없다.
      #
      # 서드파티 액션 대신 공식 릴리스를 직접 받는다. 의존을 하나 줄인다.
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.164.0
        run: |
          curl -sSLo /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version

      # Hugo 가 사이트 전체를 만든다. 예전에는 대문(손으로 쓴 index.html)을 두고
      # 시안만 /sample/ 아래에 올렸지만, 첫 글이 나오면서 루트를 Hugo 에 넘겼다.
      # baseURL 은 hugo.toml 에 있으므로 여기서 덮어쓰지 않는다.
      #
      # 담기는 것은 content/ 와 layouts/ 와 static/ 의 산출물뿐이다.
      # README.md, CLAUDE.md, docs/ 는 Hugo 가 아예 보지 않으므로 따로 걸러낼 것이 없다.
      # (기본 배포 방식은 저장소 루트를 통째로 올리고 Jekyll 까지 돌려서
      #  작업 문서가 개인 도메인에서 서비스된다. 그래서 이 워크플로를 쓴다)
      #
      # CNAME 은 static/ 에 있어서 Hugo 가 알아서 복사한다. 빼먹으면 커스텀 도메인이 풀린다.
      - name: Build site (Hugo)
        run: |
          hugo --minify --destination _site
          echo "--- 배포될 파일 ---"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
