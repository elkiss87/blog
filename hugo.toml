# Hugo 설정. 지금은 /sample/ 아래에 시안만 올린다.
# 대문(루트 index.html)은 Hugo 가 건드리지 않는다 — 시안이 엎어져도 사이트는 멀쩡해야 한다.
#
# baseURL 은 배포 워크플로에서 --baseURL 로 덮어쓴다.
# 여기 값은 로컬에서 `hugo server` 로 띄울 때 쓰인다.
baseURL = 'https://blog.elkiss.me/'
title = 'ELKISS BLOG'

locale = 'ko-kr'               # 0.158 부터 languageCode 를 대신한다
defaultContentLanguage = 'ko'
hasCJKLanguage = true          # 한글 글자수를 세어 요약·읽는 시간을 맞게 계산한다

enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']   # 태그·카테고리는 글이 쌓인 뒤에 만든다 (docs/PLAN.md §5)

[params]
  description = '만들다가 생긴 의문을 알아보고 정리하는 기술 블로그'

  # 커버가 없는 페이지(대문·소개)의 미리보기 그림.
  # 글은 각자 front matter 의 cover 를 쓴다 (docs/PLAN.md §5).
  cover = 'images/athena-and-commander.png'

# 글 주소는 `/<파일명>/` 이다. 도메인이 이미 blog.elkiss.me 라 /posts/ 를 또 붙이면
# 같은 말을 두 번 한다. content/posts/ 폴더는 유지되지만 주소에는 안 나온다 —
# 파일 정리와 주소 모양을 분리해두면 나중에 폴더를 나눠도 주소가 안 깨진다.
#
# :contentbasename 은 파일명을 쓴다. :slug 를 쓰면 안 된다 —
# front matter 에 slug 를 빠뜨린 글이 조용히 한글 제목을 주소로 삼는다.
# 파일명 기반은 주소가 파일 트리에 그대로 보여서 빠뜨릴 자리가 없다.
[permalinks]
  posts = '/:contentbasename/'

[markup.goldmark.renderer]
  unsafe = true                # 본문에 HTML 을 직접 쓸 수 있게 한다

[markup.goldmark.parser]
  # 한 줄에 그림만 있을 때 <p> 로 감싸지 않는다.
  # 감싸면 <p> 안에 <figure> 가 들어가는데 그건 올바른 HTML 이 아니고,
  # 브라우저가 알아서 <p> 를 끊어버려서 여백이 어긋난다.
  # 이 값을 꺼야 렌더 훅에서 .IsBlock 으로 "혼자 있는 그림" 을 구분할 수 있다.
  wrapStandAloneImageWithinParagraph = false

[markup.highlight]
  # 색을 인라인 style 로 넣지 않고 클래스로 뽑아서 CSS 에서 잡는다.
  # 인라인이면 코드 블록마다 같은 색 문자열이 HTML 에 실려 오고,
  # 나중에 색을 바꾸려면 전체를 다시 빌드해야 한다.
  noClasses = false
  lineNos = false
  tabWidth = 2

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
