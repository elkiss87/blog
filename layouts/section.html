{{ define "main" }}
  <h1 class="page-title">{{ .Title }}</h1>

  <ul class="post-list">
    {{ range .RegularPagesRecursive.ByDate.Reverse }}
      <li class="post-item">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
{{ end }}
