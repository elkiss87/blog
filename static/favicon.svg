<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- elkiss.me 파비콘과 같은 아이콘이다. 세로 기둥에 가로 세 줄, 가운데만 짧은
       블록 대문자 E. 두 사이트가 한 사람의 것으로 읽히는 쪽을 택했다.

       탭에 둘 다 띄우면 구분이 안 되지만, 그렇게 여는 사람은 사실상 만든 사람뿐이다.
       방문자는 프로필에서 블로그로 한 번 넘어갈 뿐 둘을 동시에 열어두지 않는다.

       profile-site 는 이 그림을 index.html 안에 data URI 로 넣었다.
       여기서는 파일로 둔다. 앞으로 목록·본문·소개로 페이지가 늘어나는데,
       data URI 는 페이지마다 HTML 에 같은 문자열이 실려 오는 반면
       파일은 브라우저가 한 번 받아 캐시한다 -->
  <rect width="32" height="32" rx="7" fill="#1c1c1a"/>
  <g fill="#faf9f7">
    <rect x="6" y="5" width="5.5" height="22"/>
    <rect x="6" y="5" width="20" height="5.5"/>
    <rect x="6" y="13.25" width="16" height="5.5"/>
    <rect x="6" y="21.5" width="20" height="5.5"/>
  </g>
</svg>
